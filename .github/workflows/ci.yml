name: CI/CD SportBook UA

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ── 1. Backend unit tests ──────────────────────────────────────────────────
  test-backend-unit:
    name: Unit Tests (Backend)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -r requirements.txt pytest-cov pytest-asyncio

      - name: Run unit tests with coverage
        run: |
          python -m coverage run --source=src -m pytest tests/unit/ -v --tb=short --junitxml=junit.xml
          python -m coverage xml -o coverage.xml
          python -m coverage html -d htmlcov
          python -m coverage report --show-missing
        env:
          SECRET_KEY: test-secret-key

      - name: Upload XML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 7

      - name: Upload JUnit test report
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: junit.xml
          retention-days: 7

  # ── 2. Backend integration tests ───────────────────────────────────────────
  test-backend-integration:
    name: Integration Tests (Backend)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sportbook
          POSTGRES_PASSWORD: sportbook
          POSTGRES_DB: sportbook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -r requirements.txt pytest-cov pytest-asyncio

      - name: Run integration tests
        run: |
          pytest tests/integration/ -v --tb=short \
            --junitxml=junit-integration.xml
        env:
          DATABASE_URL: sqlite:///./test.db
          SECRET_KEY: test-secret-key

      - name: Upload integration test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-integration-report
          path: junit-integration.xml
          retention-days: 7

  # ── 3. Linting ────────────────────────────────────────────────────────────
  lint:
    name: Code Style (flake8)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-lint-${{ runner.os }}

      - run: pip install flake8
      - run: flake8 src/ tests/ --max-line-length=120 --exclude=__pycache__,migrations

  # ── 4. SonarQube / SonarCloud ────────────────────────────────────────────
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: [test-backend-unit]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements.txt pytest-cov pytest-asyncio

      - name: Run tests and generate coverage for SonarCloud
        run: |
          python -m coverage run --source=src -m pytest tests/unit/ -v --junitxml=junit.xml
          python -m coverage xml -o coverage.xml
        env:
          SECRET_KEY: test-secret-key

      - name: Verify coverage file exists
        run: ls -la coverage.xml && head -5 coverage.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.python.version=3.11

  # ── 5. Frontend build ────────────────────────────────────────────────────
  test-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build production bundle
        run: npm run build
        env:
          REACT_APP_API_URL: http://localhost:8000/api
          CI: false

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/
          retention-days: 3

  # ── 6. Docker images build ───────────────────────────────────────────────
  docker-build:
    name: Docker Build (main only)
    runs-on: ubuntu-latest
    needs: [test-backend-unit, test-backend-integration, test-frontend, lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: sportbook-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: sportbook-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
