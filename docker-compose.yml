version: '3.9'

# ── Shared network ────────────────────────────────────────────────────────────
networks:
  sportbook-net:
    driver: bridge

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  uploads_data:

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sportbook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sportbook}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - sportbook-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sportbook} -d ${POSTGRES_DB:-sportbook}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Backend (FastAPI) ────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sportbook}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sportbook}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    networks:
      - sportbook-net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Frontend (React + Nginx) ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - sportbook-net
    depends_on:
      backend:
        condition: service_healthy
